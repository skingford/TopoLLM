# TopoLLM 网关配置示例。复制为 configs/config.yaml 后按需修改。
# 所有字段均可用环境变量覆盖：前缀 TOPOLLM_，点替换为下划线。
# 例如 server.port -> TOPOLLM_SERVER_PORT

server:
  port: 8080
  mode: release          # debug | release
  shutdown_timeout: 10   # 优雅关闭超时（秒）

log:
  level: info            # debug | info | warn | error
  format: json           # json | console

database:
  enabled: false
  # dsn: "topollm:topollm@tcp(127.0.0.1:3306)/topollm?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0

# 对外 API 令牌鉴权（Phase 5 将接入数据库管理）。
auth:
  enabled: false
  # tokens:
  #   - "sk-your-gateway-token"

# 限流（每令牌/IP）。当前为单机内存令牌桶；分布式 Redis 版为后续阶段。
rate_limit:
  enabled: false
  rpm: 60

# 上游供应商渠道（数据驱动，支持自定义供应商）。
# adaptor 支持 "openai"（OpenAI 兼容）与 "claude"（Anthropic Messages）。
channels: []
