# TopoLLM 网关配置示例。复制为 configs/config.yaml 后按需修改。
# 所有字段均可用环境变量覆盖：前缀 TOPOLLM_，点替换为下划线。
# 例如 server.port -> TOPOLLM_SERVER_PORT

server:
  port: 8080
  mode: release          # debug | release
  shutdown_timeout: 10   # 优雅关闭超时（秒）

log:
  level: info            # debug | info | warn | error
  format: json           # json | console

database:
  enabled: false
  # dsn: "topollm:topollm@tcp(127.0.0.1:3306)/topollm?charset=utf8mb4&parseTime=True&loc=Local"

redis:
  enabled: false
  addr: "localhost:6379"
  password: ""
  db: 0

# 对外 API 令牌鉴权。
auth:
  enabled: false
  # tokens:
  #   - "sk-your-gateway-token"

# 限流（每令牌/IP）。当前为单机内存令牌桶；分布式 Redis 版为后续阶段。
rate_limit:
  enabled: false
  rpm: 60

# 渠道熔断：某渠道连续失败达 threshold 次后熔断 cooldown_seconds 秒，期间不被选中。
circuit_breaker:
  threshold: 5
  cooldown_seconds: 30

# 计费与配额。enabled=false 时仅记录用量、不强制配额。
# pricing：每百万 token 价格，"default" 为兜底。quotas：每令牌总额度（缺省不限）。
billing:
  enabled: false
  pricing:
    default: { input: 0.0, output: 0.0 }
    # "deepseek-chat": { input: 0.14, output: 0.28 }
  quotas: {}
    # "sk-your-gateway-token": 100.0

# 运维管理 API（/admin，需 admin 令牌；含 SSRF 出口防护）。
admin:
  enabled: false
  token: ""                       # 管理接口 Bearer 令牌（enabled 时必填）
  allow_private_upstreams: false  # 是否允许内网上游（自托管 vLLM/Ollama 时设 true）
  allowed_upstream_hosts: []      # SSRF 白名单主机（精确匹配）

# 请求前置插件（按 priority 降序执行，可短路拒绝）。内置：sensitive_words、audit。
plugins: []
  # - name: audit
  #   enabled: true
  #   priority: 100
  # - name: sensitive_words
  #   enabled: true
  #   priority: 50
  #   options:
  #     words: ["违禁词1", "违禁词2"]

# 上游供应商渠道（数据驱动，支持自定义供应商）。
