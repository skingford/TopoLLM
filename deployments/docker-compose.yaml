services:
  gateway:
    build:
      context: ..
      dockerfile: deployments/Dockerfile
    ports:
      - "8080:8080"
    environment:
      TOPOLLM_DATABASE_ENABLED: "true"
      TOPOLLM_DATABASE_DSN: "topollm:topollm@tcp(mysql:3306)/topollm?charset=utf8mb4&parseTime=True&loc=Local"
      TOPOLLM_REDIS_ENABLED: "true"
      TOPOLLM_REDIS_ADDR: "redis:6379"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: topollm
      MYSQL_USER: topollm
      MYSQL_PASSWORD: topollm
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
